    <script>
      (function() {
        try {
          // Solo señales reales de la app de escritorio. Antes cualquier dominio que no fuera
          // vercel.app/cajago.com/stockia (localhost, dominios propios) se tomaba como Desktop
          // y la web intentaba abrir la base SQLite de Tauri.
          var host = window.location.hostname || '';
          var isDesktop = Boolean(
            (navigator.userAgent && navigator.userAgent.indexOf('CajaGo-Desktop') !== -1) ||
            '__TAURI_INTERNALS__' in window ||
            '__TAURI__' in window ||
            host === 'tauri.localhost' ||
            window.location.protocol === 'tauri:'
          );

          if (isDesktop) {
            window.isTauri = true;
            window.__IS_TAURI_DESKTOP__ = true;
            try { localStorage.setItem('cajago_desktop_mode', 'true'); } catch (e) {}
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                for (var i = 0; i < regs.length; i++) regs[i].unregister();
              });
            }
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                for (var i = 0; i < keys.length; i++) caches.delete(keys[i]);
              });
            }
          }
        } catch (e) {}
      })();
    </script>
    <style>

      .cg-splash img { width: 64px; height: 64px; animation: cg-splash-pulse 1.6s ease-in-out infinite; filter: drop-shadow(0 12px 32px rgba(154,169,255,0.35)); }

      .cg-splash i { display: block; width: 140px; height: 3px; border-radius: 9px; background: rgba(255,255,255,0.08); overflow: hidden; position: relative; }
      .cg-splash i::after { content: ''; position: absolute; inset: 0; width: 40%; border-radius: 9px; background: #9aa9ff; box-shadow: 0 0 12px rgba(154,169,255,0.8); animation: cg-splash-bar 1.1s ease-in-out infinite; }
      @keyframes cg-splash-pulse { 50% { transform: scale(0.94); opacity: 0.85; } }
